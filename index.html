<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cairo',system-ui,sans-serif;font-size:15px;background:var(--bg);color:var(--text);line-height:1.8;min-height:100vh;-webkit-font-smoothing:antialiased}

.m{max-width:920px;margin:0 auto;padding:36px 20px 80px}

.n{max-width:480px;margin:60px auto}
label{display:block;font-weight:600;font-size:14px;color:var(--navy);margin-bottom:8px}
input,select{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--text);transition:border-color .15s,box-shadow .15s}

input::placeholder{color:#a8b3c2}
.f{margin-bottom:20px}

.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.p{background:var(--blue);color:#fff}
.p:hover:not(:disabled){background:var(--blue-dark)}
.s{background:#fff;border-color:var(--border);color:var(--navy)}
.s:hover{background:#f5f8fc;border-color:#c5d1e0}
.b{width:100%;padding:14px}
.row{display:flex;gap:12px;justify-content:flex-end;flex-wrap:wrap;margin-top:24px}

.err{background:#fdf2f0;border:1px solid #f5d0cc;color:var(--danger)}
.ok{background:#eefaf4;border:1px solid #c3ead6;color:var(--success)}
.inf{background:var(--blue-soft);border:1px solid #d4e2f5;color:var(--blue-dark)}
.mut{color:var(--muted);font-size:14px;line-height:1.7}
.track{height:8px;background:#eaeff5;border-radius:999px;overflow:hidden;margin:16px 0 24px}
.bar{height:100%;background:linear-gradient(90deg,var(--blue),#4a7ec7);transition:width .3s;width:0;border-radius:999px}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap;gap:8px;font-weight:500}

.hide{display:none!important}
h1{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:12px;letter-spacing:-.3px}
h2{font-size:18px;font-weight:700;color:var(--navy);margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:12px 10px;text-align:right;border-bottom:1px solid var(--border)}
th{background:#f9fbfd;font-weight:700;color:var(--navy);font-size:13px}
tbody tr:hover{background:#fafbfd}
#debug{display:none;background:#fdf2f0;border:1px solid #f5d0cc;color:var(--danger);padding:12px 20px;margin:12px 20px;border-radius:10px;font-size:13px}

.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}

@media(max-width:640px){.m{padding:20px 14px 60px}.c{padding:24px 20px;border-radius:12px}.n{margin:30px auto}.qt{font-size:18px}.qt pre{font-size:12px}.row .btn{flex:1}h1{font-size:21px}}

</head>

var user = null, qs = [], idx = 0, ans = {}, spec = null;

var timerId = null, timerLeft = TIME_LIMIT;
var KEYS = ['أ','ب','ج','د'];
var NV_LETTERS = ['A','B','C','D','E','F','G','H'];

function lbl(q, i){ return q[3] === 'nv' ? NV_LETTERS[i] : KEYS[i]; }
function fmtTime(s){ var m = Math.floor(s/60); return m + ':' + (s%60 < 10 ? '0' : '') + (s%60); }
function $(id){ return document.getElementById(id); }

function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) {
    for (var k in attrs) {
      var v = attrs[k];
      if (k === 'cls') e.className = v;
      else if (k === 'txt') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'style') e.setAttribute('style', v);
      else if (k === 'on' && typeof v === 'function') e.onclick = v;
      else if (k === 'for') e.setAttribute('for', v);
      else e.setAttribute(k, v);
    }
  }
  if (kids) {
    (Array.isArray(kids) ? kids : [kids]).forEach(function(c){
      if (c === null || c === undefined) return;
      e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
  }
  return e;
}

function reset(){
  var a = $('app'); if (a) a.innerHTML = '';
  var h = $('hdr'); if (h) h.innerHTML = '';
}
function safeGet(k, fb){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; }catch(_){ return fb; } }
function safeSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(_){} }

function showConfirm(title, message, onConfirm){
  var overlay = $('modal-overlay');
  $('modal-title').textContent = title || 'تأكيد';
  $('modal-message').textContent = message || 'هل أنت متأكد؟';

  var confirmBtn = $('modal-confirm');
  var cancelBtn = $('modal-cancel');

  var newConfirm = confirmBtn.cloneNode(true);
  confirmBtn.parentNode.replaceChild(newConfirm, confirmBtn);
  var newCancel = cancelBtn.cloneNode(true);
  cancelBtn.parentNode.replaceChild(newCancel, cancelBtn);

  newConfirm.onclick = function(){
    overlay.classList.remove('active');
    if (onConfirm) onConfirm();
  };
  newCancel.onclick = function(){ overlay.classList.remove('active'); };
  overlay.onclick = function(ev){ if (ev.target === overlay) overlay.classList.remove('active'); };

  overlay.classList.add('active');
}

function startTimer(){
  stopTimer();
  timerLeft = TIME_LIMIT;
  updateTimerUI();
  timerId = setInterval(function(){
    timerLeft--;
    updateTimerUI();
    if (timerLeft <= 0) { stopTimer(); doSubmit(true); }
  }, 1000);
}
function stopTimer(){ if (timerId) { clearInterval(timerId); timerId = null; } }
function updateTimerUI(){
  var t = $('timer');
  if (!t) return;
  t.textContent = '⏱ ' + fmtTime(timerLeft);
  t.classList.remove('warn','danger');
  if (timerLeft <= 60) t.classList.add('danger');
  else if (timerLeft <= 180) t.classList.add('warn');
}

function submitToFormspree(fields, callback){
  var fd = new FormData();
  for (var k in fields) fd.append(k, String(fields[k] == null ? '' : fields[k]));

  fetch(FORMSPREE, { method:'POST', body:fd, headers:{ 'Accept':'application/json' } })
  .then(function(res){ console.log('Formspree status:', res.status); return res.ok; })
  .then(function(ok){ console.log('Formspree OK:', ok); if (callback) callback(ok); })
  .catch(function(err){
    console.error('Formspree error:', err);
    submitViaIframe(fields);
    if (callback) callback(false);
  });
}

function submitViaIframe(fields){
  var frameName = 'fp_frame_' + Date.now();
  var iframe = document.createElement('iframe');
  iframe.name = frameName;
  iframe.style.cssText = 'position:absolute;width:0;height:0;border:0;visibility:hidden;';
  document.body.appendChild(iframe);

  var form = document.createElement('form');
  form.method = 'POST';
  form.action = FORMSPREE;
  form.target = frameName;
  form.style.display = 'none';
  form.acceptCharset = 'UTF-8';

  for (var k in fields) {
    var inp = document.createElement('input');
    inp.type = 'hidden';
    inp.name = k;
    inp.value = String(fields[k] == null ? '' : fields[k]);
    form.appendChild(inp);
  }
  document.body.appendChild(form);
  try { form.submit(); } catch(e) { console.error('iframe submit failed:', e); }
  setTimeout(function(){
    try { form.remove(); } catch(_){}
    setTimeout(function(){ try { iframe.remove(); } catch(_){} }, 3000);
  }, 2000);
}

function login(){
  reset();
  stopTimer();
  user = null;
  submitted = false;

  var nameIn = el('input', {id:'n', placeholder:'الاسم الكامل', autocomplete:'name'});
  var mailIn = el('input', {type:'email', id:'e', dir:'ltr', placeholder:'name@example.com', autocomplete:'email'});
  var errBox = el('div', {cls:'err hide'});
  var btn = el('button', {cls:'btn p b', txt:'متابعة'});

  function handle(){
    errBox.classList.add('hide');
    var n = String(nameIn.value || '').trim();
    var e = String(mailIn.value || '').trim().toLowerCase();

    if (n.length < 3) {
      errBox.textContent = 'الاسم قصير جدًا (3 أحرف على الأقل).';
      errBox.classList.remove('hide');
      nameIn.focus();
      return;
    }
    if (!/^\S+@\S+\.\S+$/.test(e)) {
      errBox.textContent = 'صيغة البريد الإلكتروني غير صحيحة.';
      errBox.classList.remove('hide');
      mailIn.focus();
      return;
    }

    user = {name:n, email:e};
    if (e === ADMIN_EMAIL.toLowerCase()) dashboard();
    else intro();
  }

  btn.onclick = handle;
  mailIn.onkeydown = function(ev){ if (ev.key === 'Enter') handle(); };
  nameIn.onkeydown = function(ev){ if (ev.key === 'Enter') mailIn.focus(); };

  var card = el('div', {cls:'c n'});
  card.appendChild(el('h1', {txt:'تسجيل الدخول'}));
  card.appendChild(el('p', {cls:'mut', txt:'أدخل اسمك الكامل وبريدك الإلكتروني للمتابعة.'}));
  card.appendChild(errBox);

  var f1 = el('div', {cls:'f'});
  f1.appendChild(el('label', {txt:'الاسم الكامل'}));
  f1.appendChild(nameIn);
  card.appendChild(f1);

  var f2 = el('div', {cls:'f'});
  f2.appendChild(el('label', {txt:'البريد الإلكتروني'}));
  f2.appendChild(mailIn);
  card.appendChild(f2);

  card.appendChild(btn);
  $('app').appendChild(card);
  setTimeout(function(){ nameIn.focus(); }, 100);
}

function intro(){
  reset();
  stopTimer();
  $('hdr').appendChild(el('button', {cls:'btn s', style:'padding:8px 16px;font-size:13px', on:function(){
    showConfirm('خروج', 'هل تريد الخروج والعودة لشاشة الدخول؟', login);
  }, txt:'خروج'}));

  var sel = el('select', {id:'sp'});
  sel.appendChild(el('option', {value:'', txt:'— اختر التخصص —'}));
  SPECS.forEach(function(s){ sel.appendChild(el('option', {value:s.code, txt:s.label})); });

  var err = el('div', {cls:'err hide'});
  var btn = el('button', {cls:'btn p b', txt:'ابدأ الاختبار (12 دقيقة)'});

  btn.onclick = function(){
    if (!sel.value) {
      err.textContent = 'يرجى اختيار التخصص أولًا.';
      err.classList.remove('hide');
      return;
    }
    spec = sel.value;
    qs = SHARED.concat(SPEC_Q[spec] || []);
    idx = 0;
    ans = {};
    submitted = false;
    startTimer();
    question();
  };

  var card = el('div', {cls:'c n'});
  card.appendChild(el('h1', {txt:'اختيار التخصص وتعليمات الاختبار'}));
  card.appendChild(el('div', {cls:'inf', html:
    '<b>عدد الأسئلة:</b> 12 سؤالًا لكل تخصص<br>' +
    '<b>المدة:</b> 12 دقيقة — سيتم الإرسال تلقائيًا عند انتهاء الوقت<br>' +
    '<b>الدرجة العظمى:</b> 20 درجة<br>' +
    'انتبه: المؤقت يبدأ بمجرد الضغط على زر البدء.'
  }));
  card.appendChild(err);

  var f = el('div', {cls:'f'});
  f.appendChild(el('label', {txt:'التخصص'}));
  f.appendChild(sel);
  card.appendChild(f);
  card.appendChild(btn);

  $('app').appendChild(card);
}

function question(){
  if (submitted) return;
  reset();
  $('hdr').appendChild(el('button', {cls:'btn s', style:'padding:8px 16px;font-size:13px', on:function(){
    showConfirm('خروج', 'هل تريد الخروج؟ سيتم إلغاء الاختبار الحالي ولن يتم حفظ إجاباتك.', function(){
      stopTimer();
      login();
    });
  }, txt:'خروج'}));

  var q = qs[idx];
  var total = qs.length;
  var pct = (idx/total)*100;

  var opts = el('div');
  q[1].forEach(function(txt, i){
    var isSel = ans[idx] === i;
    var card = el('label', {cls:'opt' + (isSel ? ' sel' : '')});
    var rdo = el('input', {type:'radio', name:'q'+idx, value:String(i)});
    if (isSel) rdo.checked = true;

    function selectThis(){
      ans[idx] = i;
      var all = document.querySelectorAll('.opt');
      for (var j=0;j<all.length;j++) all[j].classList.remove('sel');
      card.classList.add('sel');
    }

    rdo.onchange = selectThis;
    card.onclick = function(ev){
      if (ev.target !== rdo) { rdo.checked = true; selectThis(); }
    };

    var shown = q[3] === 'nv' ? 'الشكل ' + lbl(q,i) : txt;

    card.appendChild(rdo);
    card.appendChild(el('span', {cls:'k', txt:lbl(q,i) + '.'}));
    if (shown) card.appendChild(el('span', {html:shown}));
    opts.appendChild(card);
  });

  var prev = el('button', {cls:'btn s', type:'button', txt:'السابق'});
  if (idx === 0) prev.disabled = true;
  prev.onclick = function(){ if (idx > 0){ idx--; question(); } };

  var isLast = (idx === total - 1);
  var next = el('button', {cls:'btn p', type:'button', txt: isLast ? 'إنهاء وإرسال الاختبار' : 'التالي'});
  next.onclick = function(){
    if (ans[idx] === undefined) {
      alert('الرجاء اختيار إجابة قبل المتابعة.');
      return;
    }
    if (!isLast) { idx++; question(); }
    else {
      next.disabled = true;
      next.innerHTML = '<span class="spinner"></span> جاري الإرسال...';
      doSubmit(false);
    }
  };

  var timerEl = el('span', {id:'timer', txt:'⏱ ' + fmtTime(timerLeft)});

  var card = el('div', {cls:'c'});
  card.appendChild(el('div', {cls:'meta'}, [
    el('span', {txt:'السؤال ' + (idx+1) + ' من ' + total + ' — ' + (SPECS.find(function(s){return s.code===spec;}) || {}).label}),
    timerEl
  ]));
  card.appendChild(el('div', {cls:'track'}, [el('div', {cls:'bar', style:'width:' + pct + '%'})]));
  card.appendChild(el('div', {cls:'qt', html:q[0]}));
  if (q[5]) card.appendChild(el('img', {src:q[5], alt:'سؤال استدلال بصري', loading:'lazy'}));
  card.appendChild(opts);
  card.appendChild(el('div', {cls:'row'}, [prev, next]));

  $('app').appendChild(card);
  updateTimerUI();
  window.scrollTo({top:0, behavior:'smooth'});
}

function doSubmit(fromTimer){
  if (submitted) return;
  submitted = true;
  stopTimer();

  var specLabel = (SPECS.find(function(s){return s.code===spec;}) || {}).label || spec;

  var fields = {};
  fields['_subject']         = 'نتيجة اختبار: ' + user.name + ' — ' + specLabel;
  fields['candidate_name']   = user.name;
  fields['candidate_email']  = user.email;
  fields['specialty']        = specLabel;
  fields['submitted_at']     = new Date().toLocaleString('ar-EG');
  if (fromTimer) fields['note'] = 'تم الإرسال تلقائيًا عند انتهاء الوقت';

  var correct = 0;
  var gradable = 0;

  qs.forEach(function(q, i){
    var sel = ans[i];
    var noKey = (q[2] === null);

    if (!noKey) {
      gradable++;
      if (sel !== undefined && sel === q[2]) correct++;
    }

    var plainQ = q[4] || q[0].replace(/<[^>]+>/g,'');
    var optText = function(n){ return q[3] === 'nv' ? 'الشكل ' + lbl(q,n) : q[1][n].replace(/<[^>]+>/g,''); };
    var answerText = (sel !== undefined) ? lbl(q,sel) + '. ' + optText(sel) : '(لم يجب)';

    fields['q' + (i+1)] = plainQ;
    fields['a' + (i+1)] = answerText;

    if (noKey) {
      fields['r' + (i+1)] = '📋 للمراجعة اليدوية (لا تصحيح تلقائي)';
    } else {
      var correctText = lbl(q,q[2]) + '. ' + optText(q[2]);
      fields['r' + (i+1)] = (sel === q[2]) ? '✓ صحيح' : '✗ خطأ — الصحيح: ' + correctText;
    }
  });

  var score = gradable > 0 ? Math.round(correct * (20/gradable) * 100) / 100 : 0;
  fields['correct_count'] = correct + '/' + gradable + ' (من أصل ' + qs.length + ' سؤال)';
  fields['test_score']    = score + '/20';

  var saved = safeGet('subs', []);
  saved.push({
    name: user.name, email: user.email, spec: specLabel,
    score: score, correct: correct, gradable: gradable, total: qs.length,
    date: new Date().toISOString(),
    fields: fields
  });
  safeSet('subs', saved);

  showSuccess(fromTimer);

  submitToFormspree(fields, function(ok){
    console.log('انتهت محاولة الإرسال. نجاح:', ok);
  });
}

function showSuccess(fromTimer){
  reset();
  $('hdr').appendChild(el('button', {cls:'btn s', style:'padding:8px 16px;font-size:13px', on:login, txt:'خروج'}));

  var c = el('div', {cls:'c n'});
  c.appendChild(el('h1', {txt:'✓ تم تسليم الاختبار'}));

  var successMsg = fromTimer
    ? 'انتهى الوقت المحدد وتم إرسال إجاباتك تلقائيًا.'
    : 'شكرًا ' + user.name + '، تم استلام إجاباتك بنجاح.';
  c.appendChild(el('div', {cls:'ok', txt: successMsg}));
  c.appendChild(el('p', {cls:'mut', txt:'تم تسجيل إجاباتك وإرسالها إلى فريق التقييم. سيتم التواصل معك بخصوص المرحلة التالية.'}));

  c.appendChild(el('div', {style:'margin-top:24px;text-align:center'}, [
    el('button', {cls:'btn s', on:login, txt:'العودة للصفحة الرئيسية'})
  ]));

  $('app').appendChild(c);
  window.scrollTo({top:0, behavior:'smooth'});
}

function dashboard(){
  reset();
  stopTimer();
  $('hdr').appendChild(el('button', {cls:'btn s', style:'padding:8px 16px;font-size:13px', on:login, txt:'خروج'}));

  var app = $('app');
  app.appendChild(el('h1', {txt:'لوحة التحكم'}));
  app.appendChild(el('p', {cls:'mut', txt:'مرحبًا ' + user.name + ' — إدارة التقييمات.'}));

  var saved = safeGet('subs', []);

  var stats = el('div', {cls:'c'});
  stats.appendChild(el('div', {cls:'inf', html:
    '<b>عدد الاختبارات على هذا المتصفح:</b> ' + saved.length + '<br>' +
    'كل الردود تُرسل تلقائيًا إلى بريدك عبر Formspree.'
  }));
  app.appendChild(stats);

  if (saved.length) {
    var wrap = el('div', {cls:'c', style:'padding:0;overflow:hidden'});
    var tbl = el('table');
    var thead = el('thead');
    var hrow = el('tr');
    ['الاسم','البريد','التخصص','الدرجة','التاريخ'].forEach(function(t){
      hrow.appendChild(el('th', {txt:t}));
    });
    thead.appendChild(hrow);
    tbl.appendChild(thead);

    var tbody = el('tbody');
    saved.slice().reverse().forEach(function(s){
      var tr = el('tr');
      tr.appendChild(el('td', {txt:s.name}));
      tr.appendChild(el('td', {txt:s.email, style:'direction:ltr;text-align:right;font-size:13px'}));
      tr.appendChild(el('td', {txt:s.spec || '-'}));
      var scoreTxt = (s.gradable != null)
        ? s.score + '/20 (' + s.correct + '/' + s.gradable + ')'
        : s.score + '/20';
      tr.appendChild(el('td', {txt:scoreTxt, style:'font-weight:700;color:var(--blue)'}));
      tr.appendChild(el('td', {txt:new Date(s.date).toLocaleDateString('ar-EG'), style:'font-size:13px;color:var(--muted)'}));
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    app.appendChild(wrap);
  } else {
    app.appendChild(el('div', {cls:'c', style:'text-align:center;padding:48px 24px'}, [
      el('p', {cls:'mut', txt:'لا توجد اختبارات محفوظة على هذا المتصفح بعد.'})
    ]));
  }

  var box = el('div', {cls:'c'});
  box.appendChild(el('h2', {txt:'مصادر النتائج'}));
  box.appendChild(el('p', {cls:'mut', html:
    '١. <b>البريد الإلكتروني:</b> كل اختبار يصل إلى بريدك عبر Formspree (بعد تأكيد البريد).<br>' +
    '٢. <b>لوحة Formspree:</b> لمشاهدة كل الردود السابقة.'
  }));
  box.appendChild(el('a', {cls:'btn p', href:'https://formspree.io/forms', target:'_blank', style:'text-decoration:none;margin-top:12px;display:inline-block', txt:'فتح لوحة Formspree ←'}));
  app.appendChild(box);
}

window.addEventListener('error', function(e){
  var d = $('debug');
  if (d){ d.style.display='block'; d.textContent='خطأ: '+(e.error?e.error.message:e.message); }
});
window.addEventListener('unhandledrejection', function(e){
  var d = $('debug');
  if (d){ d.style.display='block'; d.textContent='خطأ: '+(e.reason?(e.reason.message||e.reason):'unknown'); }
});

login();
